:root{--ink:#34514d;--cream:#fffaf0;--mint:#7bc9a4;--coral:#ff927e;--gold:#ffcf67}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c8eedb;font-family:'DM Sans','Zen Maru Gothic',sans-serif;color:var(--ink);touch-action:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;outline:none}.topbar{position:absolute;top:max(14px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;pointer-events:none}.brand{border:1px solid #ffffffa6;background:#fff9e9d9;padding:9px 18px;border-radius:20px;box-shadow:0 6px 20px #54766620;text-align:center;backdrop-filter:blur(8px)}.brand strong{display:block;font-size:15px;letter-spacing:.08em}.brand small{font-size:10px;letter-spacing:.18em;color:#75978a}.hud{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px;display:flex;gap:8px}.pill{background:#fffaf0e8;border:1px solid #fff;box-shadow:0 5px 16px #43685920;border-radius:15px;padding:8px 12px;min-width:74px}.pill label{display:block;text-transform:uppercase;font-size:9px;letter-spacing:.13em;color:#77988b}.pill b{font-size:18px}.right{left:auto;right:16px}.bottom{position:absolute;left:0;right:0;bottom:max(15px,env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none}.tip{background:#fffaf0ed;padding:10px 17px;border-radius:18px;font-size:13px;font-weight:700;box-shadow:0 6px 20px #43685920;text-align:center}.tip span{color:#69a886}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#ddf7e5a6,#b7e5d2a6);backdrop-filter:blur(4px);transition:opacity .35s}.overlay.hidden{opacity:0;pointer-events:none}.card{width:min(370px,calc(100vw - 36px));padding:28px 25px 24px;text-align:center;border-radius:28px;background:#fffaf0f5;box-shadow:0 22px 65px #426c5630;border:1px solid white}.badge{display:inline-block;background:#e2f5e8;color:#5a9a79;border-radius:99px;padding:6px 11px;font-size:10px;letter-spacing:.16em;font-w <body>
<div id="game"></div>
<div class="topbar"><div class="brand"><strong>🌼 BLOOM & BREEZE</strong><small>ひだまりガーデン</small></div></div>
<div class="hud"><div class="pill"><label>花のごほうび</label><b>✿ <span id="score">0</span></b></div></div><div class="hud right"><div class="pill"><label>のこり時間</label><b>◷ <span id="time">45</span></b></div></div>
<button class="sound" id="sound" aria-label="音の切り替え">♫</button>
<div class="bottom"><div class="tip" id="tip">💧 <span>しおれた花をタップして、お水をあげよう！</span></div></div>
<div class="toast" id="toast">🌸 きれいに咲いた！ +10</div>
<div class="overlay" id="overlay"><div class="card"><span class="badge">A LITTLE GARDEN GAME</span><h1 id="title">お花にお水を<br>あげよう！</h1><p id="copy">45秒のガーデンタイム。しおれたお花をタップしてお水をあげると、かわいい花が咲くよ。いくつ咲かせられるかな？</p><div class="result" id="result"></div><button class="button" id="start">あそびはじめる</button></div></div>
<script type="module">
import * as THREE from 'three';
const host=document.querySelector('#game'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),overlay=document.querySelector('#overlay'),titleEl=document.querySelector('#title'),copyEl=document.querySelector('#copy'),resultEl=document.querySelector('#result'),startBtn=document.querySelector('#start'),toast=document.querySelector('#toast');
const scene=new THREE.Scene();scene.background=new THREE.Color('#c9efd9');scene.fog=new THREE.Fog('#c9efd9',14,34);
const camera=new THREE.PerspectiveCamera(innerWidth<600?42:36,innerWidth/innerHeight,.1,100);function frameCamera(){if(innerWidth<600){camera.fov=46;camera.position.set(-.9,9.5,18.6);camera.lookAt(-.9,1.7,0)}else{camera.fov=36;camera.position.set(0,8.2,15.8);camera.lookAt(0,1.3,0)}camera.updateProjectionMatrix()}frameCamera();
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight('#f4fff4','#88a990',1.55));const sun=new THREE.DirectionalLight('#fff2d6',2.25);sun.position.set(-5,10,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;scene.add(sun);
const mat=(color,rough=.8)=>new THREE.MeshStandardMaterial({color,roughness:rough});const groundMat=mat('#a8d89c');const ground=new THREE.Mesh(new THREE.CircleGeometry(14,64),groundMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;scene.add(ground);
const path=new THREE.Mesh(new THREE.CircleGeometry(2.5,48),mat('#e8d6a9'));path.rotation.x=-Math.PI/2;path.scale.set(1.35,.72,1);path.position.set(0,-.105,1.7);scene.add(path);
function blob(x,z,sx,sz,color,y=-.04){const o=new THREE.Mesh(new THREE.CircleGeometry(1,32),mat(color));o.rotation.x=-Math.PI/2;o.position.set(x,y,z);o.scale.set(sx,sz,1);scene.add(o);return o}
// Soft rolling garden mounds
for(const [x,z,s,c] of [[-8,-5,2.4,'#8dcc93'],[7,-6,2.8,'#92d198'],[-9,2,2.3,'#9bd69e'],[9,1,2.2,'#85c78e']]){const m=new THREE.Mesh(new THREE.SphereGeometry(s,32,20),mat(c));m.position.set(x,-1.2,z);m.scale.y=.48;m.receiveShadow=true;scene.add(m)}
// pastel clouds as small grouped spheres
function cloud(x,y,z,s){const g=new THREE.Group();for(let i=0;i<5;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(s*(.55+(i%3)*.14),16,12),mat('#f5fff0'));m.position.set((i-2)*s*.6,Math.sin(i*2)*s*.12,0);g.add(m)}g.position.set(x,y,z);scene.add(g);return g}const clouds=[cloud(-7,7,-8,1.1),cloud(6,8,-9,.8)];
// stylized tree props
function tree(x,z,size){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.13*size,.19*size,1.2*size,8),mat('#9a6948'));trunk.position.y=.6*size;g.add(trunk);for(let i=0;i<3;i++){const b=new THREE.Mesh(new THREE.SphereGeometry(.75*size-i*.08,18,14),mat(['#79b98c','#8ac797','#a2d49a'][i]));b.position.set((i-1)*.32*size,1.35*size+i*.32*size,0);b.castShadow=true;g.add(b)}g.position.set(x,0,z);scene.add(g)}tree(-6.3,-4.5,1.35);tree(6.1,-4.4,1.45);tree(-7,3.8,.85);tree(7,3.5,.9);
// tiny decorative daisies and stones
for(let i=0;i<45;i++){let a=Math.random()*Math.PI*2,r=4+Math.random()*7,x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.abs(x)<3&&z>-2&&z<4)continue;const stem=new THREE.Mesh(new THREE.CylinderGeometry(.018,.025,.22,5),mat('#5f9e66'));stem.position.set(x,.1,z);scene.add(stem);const center=new THREE.Mesh(new THREE.SphereGeometry(.055,8,7),mat('#ffd76e'));center.position.set(x,.24,z);scene.add(center);for(let j=0;j<5;j++){let q=j*Math.PI*2/5;const petal=new THREE.Mesh(new THREE.SphereGeometry(.055,8,7),mat(i%2?'#fff5dc':'#ffe3e8'));petal.position.set(x+Math.cos(q)*.07,.23,z+Math.sin(q)*.07);scene.add(petal)}}
// cute gardener (fully clothed), standing beside the flower beds
const avatar=new THREE.Group();scene.add(avatar);avatar.position.set(-3.15,0,1.7);
function sphere(parent,color,pos,scale,seg=20){const m=new THREE.Mesh(new THREE.SphereGeometry(1,seg,16),mat(color));m.position.set(...pos);m.scale.set(...scale);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
sphere(avatar,'#f1b18d',[0,1.43,0],[.38,.43,.32]);sphere(avatar,'#ffcb73',[0,1.95,0],[.43,.43,.4]);sphere(avatar,'#f1b18d',[0,2.42,-.01],[.47,.48,.42]);sphere(avatar,'#704d51',[0,2.64,-.08],[.48,.31,.43]);sphere(avatar,'#704d51',[-.35,2.4,-.01],[.15,.42,.25]);sphere(avatar,'#704d51',[.35,2.4,-.01],[.15,.42,.25]);sphere(avatar,'#f8e9c6',[0,2.91,-.03],[.52,.11,.45]);sphere(avatar,'#83c8aa',[0,3.02,-.03],[.23,.12,.23]);
// face details on front (-z)
for(const x of [-.16,.16]){sphere(avatar,'#453a40',[x,2.43,.385],[.045,.065,.025],12);sphere(avatar,'#fff',[x-.012,2.45,.408],[.012,.018,.01],8)}sphere(avatar,'#e9857f',[0,2.31,.4],[.08,.035,.02],12);sphere(avatar,'#f3a08d',[-.26,2.3,.33],[.09,.045,.02],12);sphere(avatar,'#f3a08d',[.26,2.3,.33],[.09,.045,.02],12);
// overalls bib and straps
const bib=sphere(avatar,'#56a88a',[0,1.54,-.22],[.26,.3,.12]);for(const x of [-.17,.17]){const strap=sphere(avatar,'#489a7b',[x,1.78,-.18],[.075,.28,.07]);strap.rotation.z=x<0?-.22:.22}
for(const x of [-.16,.16]){const leg=sphere(avatar,'#557e71',[x,.83,0],[.12,.43,.13]);leg.rotation.z=x<0?-.04:.04;sphere(avatar,'#f8e8ce',[x,.42,-.03],[.18,.1,.24])}
const armL=sphere(avatar,'#f1b18d',[-.46,1.56,0],[.12,.37,.13]);armL.rotation.z=-.42;const armR=sphere(avatar,'#f1b18d',[.43,1.48,-.17],[.12,.35,.13]);armR.rotation.z=.55;
// watering can in hand
const can=new THREE.Group();const body=new THREE.Mesh(new THREE.CylinderGeometry(.22,.26,.38,16),mat('#83bed3'));body.rotation.z=-Math.PI/2;can.add(body);const handle=new THREE.Mesh(new THREE.TorusGeometry(.15,.035,8,16,Math.PI),mat('#609bb1'));handle.rotation.z=Math.PI/2;handle.position.set(-.03,.22,0);can.add(handle);const spout=new THREE.Mesh(new THREE.CylinderGeometry(.055,.09,.38,12),mat('#83bed3'));spout.rotation.z=-1.05;spout.position.set(.27,.12,0);can.add(spout);can.position.set(.62,1.35,-.2);avatar.add(can);
// flower beds, each target changes from droopy bud to bloom
const flowers=[];const positions=[[-1.85,1.5],[0,2.6],[1.9,1.5],[-1.65,-.5],[.15,-.45],[1.85,-.35]];const petalColors=['#f594a7','#f4be5c','#9c9ae8','#f08772','#f5d16d','#ee91bb'];
for(let i=0;i<positions.length;i++){const [x,z]=positions[i];const bed=blob(x,z,.88,.62,['#805b48','#966747','#88604a','#93694d','#855d46','#936b4d'][i],-.01);bed.material.color.set(['#946c4f','#986f52','#92694e','#9a7051','#90684c','#9a7253'][i]);const ring=new THREE.Mesh(new THREE.TorusGeometry(.72,.035,8,40),mat('#dbc697'));ring.rotation.x=Math.PI/2;ring.position.set(x,.01,z);scene.add(ring);const stem=new THREE.Mesh(new THREE.CylinderGeometry(.045,.065,.65,8),mat('#579c69'));stem.position.set(x,.38,z);stem.castShadow=true;scene.add(stem);for(const side of [-1,1]){const leaf=new THREE.Mesh(new THREE.SphereGeometry(.18,12,10),mat('#74b879'));leaf.scale.set(1,.35,.5);leaf.position.set(x+side*.17,.3,z);leaf.rotation.z=side*.45;scene.add(leaf)}const bloom=new THREE.Group();bloom.position.set(x,.77,z);scene.add(bloom);const center=new THREE.Mesh(new THREE.SphereGeometry(.14,16,12),mat('#ffd96c'));center.position.y=.02;bloom.add(center);for(let p=0;p<7;p++){let a=p*Math.PI*2/7;const petal=new THREE.Mesh(new THREE.SphereGeometry(.15,12,10),mat(petalColors[i]));petal.scale.set(.72,1,.48);petal.position.set(Math.cos(a)*.19,.02,Math.sin(a)*.19);petal.rotation.y=-a;bloom.add(petal)}bloom.scale.setScalar(.05);bloom.visible=false;const bud=new THREE.Mesh(new THREE.SphereGeometry(.16,12,10),mat('#77aa69'));bud.position.set(x,.66,z);bud.scale.set(.75,1.3,.75);scene.add(bud);const marker=new THREE.Mesh(new THREE.SphereGeometry(.19,12,8),new THREE.MeshBasicMaterial({color:'#fff1a8',transparent:true,opacity:.8}));marker.position.set(x,1.15,z);marker.visible=false;scene.add(marker);flowers.push({x,z,bed,bloom,bud,marker,state:'waiting',wait:1+i*.7,grow:0,color:petalColors[i]})}
// rocks and floating fireflies
for(let i=0;i<18;i++){const a=i/18*Math.PI*2,r=5.8+Math.random()*2.2;const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.15+Math.random()*.16,0),mat(i%2?'#d9c99e':'#d7e5c4'));rock.position.set(Math.cos(a)*r,.08,Math.sin(a)*r);rock.scale.y=.55;rock.castShadow=true;scene.add(rock)}
const sparkles=[];for(let i=0;i<14;i++){const o=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),new THREE.MeshBasicMaterial({color:i%2?'#fff4bd':'#fff'}));o.position.set((Math.random()-.5)*12,1+Math.random()*4,(Math.random()-.5)*10);scene.add(o);sparkles.push(o)}
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let playing=false,score=0,time=45,last=0,toastTimer=0,soundOn=true,audioCtx=null;
function begin(){score=0;time=45;scoreEl.textContent='0';timeEl.textContent='45';flowers.forEach((f,i)=>{f.state='waiting';f.wait=.6+i*.6;f.grow=0;f.bloom.visible=false;f.bloom.scale.setScalar(.05);f.bud.visible=true;f.marker.visible=false});playing=true;overlay.classList.add('hidden');last=performance.now()}
startBtn.addEventListener('click',begin);document.querySelector('#sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'♫':'♪';if(soundOn)chirp(660,.07)});
function chirp(freq,duration){if(!soundOn)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.055,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+duration)}catch{}}
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),900)}
function waterAt(e){if(!playing)return;const rect=renderer.domElement.getBoundingClientRect();pointer.x=(e.clientX-rect.left)/rect.width*2-1;pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(flowers.map(f=>f.bed));if(!hits.length)return;const bed=hits[0].object;const f=flowers.find(q=>q.bed===bed);if(f.state!=='thirsty')return;f.state='blooming';f.grow=0;f.marker.visible=false;f.bud.visible=false;score+=10;scoreEl.textContent=score;time=Math.min(60,time+1);chirp(570+Math.random()*380,.16);showToast(['🌸 きれいに咲いた！ +10','✨ お水ありがとう！ +10','🌼 すてきな花！ +10'][Math.floor(Math.random()*3)]);}
renderer.domElement.addEventListener('pointerdown',waterAt);
function endGame(){playing=false;titleEl.innerHTML='すてきなガーデン！';copyEl.textContent='今日のお花は、こんなにたくさん咲いたよ。';resultEl.textContent=`✿  スコア　${score} 点`;startBtn.textContent='もう一度あそぶ';overlay.classList.remove('hidden')}
const clock=new THREE.Clock();function animate(now){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),t=now*.001;
avatar.position.y=Math.sin(t*2.4)*.035;avatar.rotation.y=Math.sin(t*.8)*.055;armR.rotation.z=.55+Math.sin(t*2)*.045;
for(const f of flowers){if(playing){if(f.state==='waiting'){f.wait-=dt;if(f.wait<=0){f.state='thirsty';f.marker.visible=true;f.marker.scale.setScalar(1)}}else if(f.state==='thirsty'){f.marker.position.y=1.12+Math.sin(t*4+f.x)*.1;f.marker.scale.setScalar(1+Math.sin(t*5)*.11);f.bud.scale.y=1.3+Math.sin(t*3)*.12}else if(f.state==='blooming'){f.grow+=dt*2.3;let s=Math.min(1,f.grow);f.bloom.visible=true;f.bloom.scale.setScalar(s);f.bloom.rotation.y+=dt*.5;if(s>=1){f.state='bloomed';f.wait=3.5+Math.random()*2}}else if(f.state==='bloomed'){f.bloom.rotation.y+=dt*.22;f.wait-=dt;if(f.wait<=0){f.state='waiting';f.wait=2+Math.random()*2;f.bloom.visible=false;f.bloom.scale.setScalar(.05);f.bud.visible=true}}}else if(f.state==='waiting'){f.wait-=dt;if(f.wait<=0){f.state='thirsty';f.marker.visible=true}}}
if(playing){time-=dt;timeEl.textContent=Math.ceil(time);if(time<=0)endGame()}
clouds.forEach((c,i)=>{c.position.x+=dt*(i?-.12:.08);if(c.position.x>10)c.position.x=-10;if(c.position.x< -10)c.position.x=10});sparkles.forEach((s,i)=>{s.position.y+=Math.sin(t*1.7+i)*.0018;s.material.opacity=.55+Math.sin(t*3+i)*.35});renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;frameCamera();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
</script></body></html>
